name: AgentShield CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-shield-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, security tests, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm run security:audit

      - name: Lint
        run: npm run lint

      - name: Run deterministic security-engine tests
        run: npm run test:engine

      - name: Build production worker
        run: npm run build

      - name: Test rendered worker output
        run: npm run test:render
